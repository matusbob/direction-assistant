pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Google's mirror of Maven Central, used when Maven Central itself is busy
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    }
}
rootProject.name = 'DirectionAssistant'
include ':app'

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Direction Assistant v2.0</title>
<style>
:root{
--bg:#0e1116;
--panel:#171b22;
--text:#f2f4f7;
--muted:#9aa4b2;
--accent:#3ba7ff;
--ok:#3ecf8e;
--warn:#ff9f43;
--danger:#ff5c5c;
--focus:#ffd93d;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
min-height:100%;
}
main{
max-width:520px;
margin:0 auto;
padding:20px 18px 60px;
}
h1{font-size:1.4rem; margin-bottom:4px;}
.lead{color:var(--muted); font-size:0.95rem; line-height:1.5; margin-bottom:20px;}

.status{
background:var(--panel);
border-radius:14px;
padding:22px 18px;
text-align:center;
margin-bottom:20px;
border:2px solid transparent;
transition:border-color .2s ease;
}
.status.ok{border-color:var(--ok);}
.status.left{border-color:var(--accent);}
.status.right{border-color:var(--warn);}
.status.off{border-color:var(--danger);}
.status h2{font-size:1.6rem; margin-bottom:6px;}
.status .sub{color:var(--muted); font-size:0.9rem;}
.btnrow{display:flex; gap:12px; margin-bottom:22px;}
button{
flex:1;
font-size:1.1rem;
font-weight:600;
padding:16px 10px;
border-radius:12px;
border:none;
cursor:pointer;
min-height:56px;
}
button:focus-visible{outline:3px solid var(--focus); outline-offset:2px;}
#mainBtn{background:var(--ok); color:#04211a;}
#mainBtn.stop{background:var(--danger); color:#2a0000;}
#resetBtn{background:var(--panel); color:var(--text); border:1px solid #2c3340;}
button:disabled{opacity:0.4; cursor:not-allowed;}
fieldset{
border:1px solid #2c3340;
border-radius:12px;
padding:14px 16px 18px;
margin:0 0 20px;
}
legend{padding:0 6px; font-weight:600;}
label{display:block; margin:12px 0 6px; font-size:0.95rem;}
input[type=range], select, input[type=number]{
width:100%;
background:var(--bg);
color:var(--text);
border:1px solid #2c3340;
border-radius:8px;
padding:8px;
font-size:1rem;
}
.rowval{display:flex; justify-content:space-between; color:var(--muted); font-size:0.85rem;}
.toggle{display:flex; align-items:center; gap:10px; margin-top:14px;}
.toggle input{width:20px; height:20px;}
#permMsg{font-size:0.85rem; color:var(--warn); margin-top:10px;}
#log{font-size:0.8rem; color:var(--muted); margin-top:10px; line-height:1.5;}
footer{
position:fixed; bottom:0; left:0; right:0;
background:var(--panel);
border-top:1px solid #2c3340;
padding:12px;
text-align:center;
}
footer button{
background:transparent;
color:var(--accent);
border:1px solid var(--accent);
padding:8px 16px;
border-radius:8px;
font-size:0.95rem;
flex:none;
}
</style>
</head>
<body>

<main>
<h1 id="title">Direction Assistant</h1>
<p class="lead" id="desc">Tool to maintain walking direction. Warns you with spatial audio, voice, or vibrations if you drift. Does not replace a white cane or guide dog.</p>

<div id="status" class="status off" role="status" aria-live="polite">
<h2 id="statusText">Ready</h2>
<div class="sub" id="statusSub">Press the main button to begin.</div>
</div>

<div class="btnrow">
<button id="mainBtn" type="button" aria-label="Start">Start</button>
<button id="resetBtn" type="button" disabled>Set Direction</button>
</div>

<div id="permMsg" role="alert"></div>
<div id="log" aria-hidden="true"></div>

<fieldset>
<legend id="settingsTitle">Settings</legend>

<label for="unitSelect" id="lblUnit">Drift measurement units</label>
<select id="unitSelect">
<option value="degrees">Degrees</option>
<option value="meters">Meters</option>
<option value="steps">Steps</option>
</select>

<label for="toleranceSelect" id="lblTolerance">Tolerance (how much to ignore)</label>
<select id="toleranceSelect">
<option value="3">3 meters</option>
<option value="5" selected>5 meters</option>
<option value="10">10 meters</option>
</select>

<label for="stepLen" id="lblStep" style="display:none;">Your step length (cm)</label>
<input type="number" id="stepLen" value="70" min="30" max="150" style="display:none;">

<label for="voiceMode" id="lblVoice">Voice output mode ("Teta")</label>
<select id="voiceMode">
<option value="off">Off</option>
<option value="drift" selected>Only when drifting</option>
<option value="always">Always speak (Straight/Drift)</option>
</select>

<div class="toggle">
<input type="checkbox" id="soundOn" checked>
<label for="soundOn" style="margin:0;" id="lblSound">Spatial audio beeps on drift</label>
</div>
<div class="toggle">
<input type="checkbox" id="vibrateOn" checked>
<label for="vibrateOn" style="margin:0;" id="lblVibrate">Vibrations on drift</label>
</div> </fieldset>
</main>

<footer>
<button id="langBtn" type="button">Slovenčina</button>
</footer>

<script>
(function(){
const T = {
en: {
title: "Direction Assistant", desc: "Tool to maintain walking direction. Warns you with spatial audio, voice, or vibrations if you drift. Does not replace a white cane or guide dog.",
start: "Start", stop: "Stop", setDir: "Set Direction",
ready: "Ready", readySub: "Press the main button to begin.",
scanning: "Scanning compass...", scanningSub: "Press Set Direction.",
dirSet: "Direction Set", dirSetSub: "Walk straight.",
straight: "Straight", straightSub: "You are on track.", backOnTrack: "Back on track.",
sRight: "Slight Right", sRightSub: "Turn left.",
hRight: "Hard Right", hRightSub: "Turn left!",
sLeft: "Slight Left", sLeftSub: "Turn right.",
hLeft: "Hard Left", hLeftSub: "Turn right!",
waitCompass: "Waiting for compass...",
stopped: "Stopped", stoppedSub: "Press Start.",
settings: "Settings",
lblUnit: "Drift measurement units", lblTolerance: "Tolerance (how much to ignore)",
optDeg: "Degrees", optMet: "Meters", optStep: "Steps",
tol3: "3 meters", tol5: "5 meters", tol10: "10 meters",
lblStep: "Your step length (cm)",
lblVoice: "Voice output mode (Teta)", voiceOff: "Off", voiceDrift: "Only when drifting", voiceAlways: "Always speak (Straight/Drift)",
lblSound: "Spatial audio beeps on drift", lblVibrate: "Vibrations on drift",
errNoSecure: "ERROR: Missing HTTPS lock. Compass blocked.",
errPerm: "Requesting permission...", errGranted: "Permission granted.", errDenied: "Permission denied.",
errTimeout: "Error: Browser not responding.", errNoData: "Failed to read compass. Check permissions.", errNoSensor: "Browser does not support compass.",
langBtn: "Slovenčina",
voiceDriftR: "Drift right", voiceDriftL: "Drift left", voiceHard: "Hard",
statDist: "Distance walked", statAvg: "Average drift", statMeters: "meters", statSteps: "steps"
},
sk: {
title: "Smerový Asistent", desc: "Pomôcka na udržanie smeru. Upozorní na vybočenie zvukom, hlasom alebo vibráciami. Nenahrádza bielu palicu ani psa.",
start: "Štart", stop: "Stop", setDir: "Nastaviť smer",
ready: "Pripravené", readySub: "Stlačte hlavné tlačidlo.",
scanning: "Snímam kompas...", scanningSub: "Stlačte Nastaviť smer.",
dirSet: "Smer nastavený", dirSetSub: "Choďte rovno.",
straight: "Rovno", straightSub: "Držíte smer.", backOnTrack: "Vrátil si sa do pôvodného smeru.",
sRight: "Mierne doprava", sRightSub: "Zabočte vľavo.",
hRight: "Silno doprava", hRightSub: "Zabočte vľavo!",
sLeft: "Mierne doľava", sLeftSub: "Zabočte vpravo.",
hLeft: "Silno doľava", hLeftSub: "Zabočte vpravo!",
waitCompass: "Čakám na kompas...",
stopped: "Zastavené", stoppedSub: "Stlačte Štart.",
settings: "Nastavenia",
lblUnit: "Jednotky merania vybočenia", lblTolerance: "Tolerancia (koľko ignorovať)",
optDeg: "Stupne", optMet: "Metre", optStep: "Kroky",
tol3: "3 metre", tol5: "5 metrov", tol10: "10 metrov",
lblStep: "Dĺžka tvojho kroku (cm)",
lblVoice: "Režim hlasového výstupu (Teta)", voiceOff: "Vypnutý", voiceDrift: "Len pri vybočení", voiceAlways: "Stále hovoriť (Rovno/Vybočenie)",
lblSound: "Priestorové pípky pri vybočení", lblVibrate: "Vibrácie pri vybočení",
errNoSecure: "CHYBA: Chýba HTTPS zámok.", errPerm: "Žiadam o povolenie...", errGranted: "Povolenie udelené.", errDenied: "Povolenie zamietnuté.",
errTimeout: "Chyba: Prehliadač neodpovedá.", errNoData: "Kompas sa nepodarilo prečítať.", errNoSensor: "Prehliadač nepodporuje kompas.",
langBtn: "English",
voiceDriftR: "Vybočenie doprava", voiceDriftL: "Vybočenie doľava", voiceHard: "Silné",
statDist: "Prejdenej vzdialenosti", statAvg: "Priemerné vybočenie", statMeters: "metrov", statSteps: "krokov"
}
};

let lang = 'en';
function t(key) { return T[lang][key] || key; }

function applyLang() {
document.title = t('title');
document.getElementById('title').textContent = t('title');
document.getElementById('desc').textContent = t('desc');
document.getElementById('settingsTitle').textContent = t('settings');
document.getElementById('lblUnit').textContent = t('lblUnit');
document.getElementById('lblTolerance').textContent = t('lblTolerance');
document.getElementById('lblStep').textContent = t('lblStep');
document.getElementById('lblVoice').textContent = t('lblVoice');
document.getElementById('lblSound').textContent = t('lblSound');
document.getElementById('lblVibrate').textContent = t('lblVibrate');
document.getElementById('langBtn').textContent = t('langBtn');

document.getElementById('unitSelect').options[0].text = t('optDeg');
document.getElementById('unitSelect').options[1].text = t('optMet');
document.getElementById('unitSelect').options[2].text = t('optStep');
document.getElementById('toleranceSelect').options[0].text = t('tol3');
document.getElementById('toleranceSelect').options[1].text = t('tol5');
document.getElementById('toleranceSelect').options[2].text = t('tol10');
document.getElementById('voiceMode').options[0].text = t('voiceOff');
document.getElementById('voiceMode').options[1].text = t('voiceDrift');
document.getElementById('voiceMode').options[2].text = t('voiceAlways');

toggleStepInput();
if (!running) announce(t('ready'), t('readySub'));
}

const mainBtn = document.getElementById('mainBtn');
const resetBtn = document.getElementById('resetBtn');
const statusBox = document.getElementById('status');
const statusText = document.getElementById('statusText');
const statusSub = document.getElementById('statusSub');
const permMsg = document.getElementById('permMsg');
const unitSelect = document.getElementById('unitSelect');
const toleranceSelect = document.getElementById('toleranceSelect');
const stepLenInput = document.getElementById('stepLen');
const stepLabel = document.getElementById('lblStep');
const voiceMode = document.getElementById('voiceMode');
const soundOn = document.getElementById('soundOn');
const vibrateOn = document.getElementById('vibrateOn');

let targetHeading = null, lastHeading = null, running = false, audioCtx = null;
let lastBeepTime = 0, lastAnnounceState = null, lastAnnounceTime = 0, lastVoiceTime = 0;
let headingSupported = false, watchdog = null;

let totalDistMeters = 0, sumDriftMeters = 0, driftSamples = 0, lastGPSTime = 0, lastLat = null, lastLon = null;

unitSelect.addEventListener('change', toggleStepInput);
voiceMode.addEventListener('change', () => {});
document.getElementById('langBtn').addEventListener('click', () => {
lang = lang === 'en' ? 'sk' : 'en';
applyLang();
});

function toggleStepInput() {
const isSteps = unitSelect.value === 'steps';
stepLenInput.style.display = isSteps ? 'block' : 'none';
stepLabel.style.display = isSteps ? 'block' : 'none';
}

function getToleranceDegrees() {
const tolMeters = parseInt(toleranceSelect.value, 10);
return tolMeters * 5;
}

function getHeading(e){
if (typeof e.webkitCompassHeading === 'number') return e.webkitCompassHeading;
if (e.alpha !== null && e.alpha !== undefined) return (360 - e.alpha) % 360;
return null;
}
function angleDiff(c, t){ return (c - t + 540) % 360 - 180; }

function ensureAudio(){
if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
if(audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(pan, freq, dur){
if(!soundOn.checked) return;
try{
ensureAudio();
const o=audioCtx.createOscillator(), g=audioCtx.createGain(), p=audioCtx.createStereoPanner?audioCtx.createStereoPanner():null;
o.frequency.value=freq; o.type='sine';
g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.5,audioCtx.currentTime+0.02);
g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
if(p){p.pan.value=pan; o.connect(g).connect(p).connect(audioCtx.destination);}
else{o.connect(g).connect(audioCtx.destination);}
o.start(); o.stop(audioCtx.currentTime+dur+0.02);
}catch(e){}
}
function vibrate(p){ if(!vibrateOn.checked || !running) return; try{navigator.vibrate(p);}catch(e){} }

function speak(text) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
u.lang = lang === 'sk' ? 'sk-SK' : 'en-US';
u.rate = 1.1;
window.speechSynthesis.speak(u);
}
}

function announce(main, sub){
statusText.textContent = main;
statusSub.textContent = sub;
}

function formatDrift(diffDegrees) {
const absDiff = Math.abs(diffDegrees);
const mode = unitSelect.value;
const tolMeters = parseInt(toleranceSelect.value, 10);

if (mode === 'degrees') {
return Math.round(absDiff) + "°";
} else if (mode === 'meters') {
const met = (absDiff / 5) * tolMeters;
return Math.round(met) + "m";
} else if (mode === 'steps') {
const stepCm = parseInt(stepLenInput.value, 10) || 70;
const met = (absDiff / 5) * tolMeters;
const steps = Math.round(met / (stepCm / 100));
return steps + " " + t('statSteps').toLowerCase();
}
return "";
}

function handleOrientation(e){
if(!running) return;
const h = getHeading(e);
if(h===null) return;
headingSupported = true;
lastHeading = h;

if(targetHeading === null) return;

const th = getToleranceDegrees();
const diff = angleDiff(h, targetHeading);
const absDiff = Math.abs(diff);
const now = performance.now();

const tolMeters = parseInt(toleranceSelect.value, 10);
const currentDriftMeters = (absDiff / 5) * tolMeters;
sumDriftMeters += currentDriftMeters;
driftSamples++;

let state, cls, mainT, subT;
if(absDiff <= th){
state='ok'; cls='ok'; mainT=t('straight'); subT=t('straightSub');
} else if(diff > 0){
state='right'; cls='right';
mainT = absDiff > th*2 ? t('hRight') : t('sRight');
subT = t('sRightSub');
} else {
state='left'; cls='left';
mainT = absDiff > th*2 ? t('hLeft') : t('sLeft');
subT = t('sLeftSub');
}

statusBox.className = 'status ' + cls;

if(state !== lastAnnounceState || now - lastAnnounceTime > 4000){
announce(mainT, subT);
lastAnnounceState = state;
lastAnnounceTime = now;
}

const vm = voiceMode.value;
if(vm !== 'off') {
if(state === 'ok' && lastAnnounceState !== 'ok' && vm === 'drift') {
speak(t('backOnTrack'));
}
else if(state !== 'ok' && now - lastVoiceTime > 3000) {
lastVoiceTime = now;
let voiceText = "";
if(state === 'ok') {
voiceText = t('straight');
} else {
const prefix = (absDiff > th*2) ? t('voiceHard') + " " : "";
const dir = (diff > 0) ? t('voiceDriftR') : t('voiceDriftL');
voiceText = prefix + dir + ": " + formatDrift(diff);
}
speak(voiceText);
}
else if(state === 'ok' && vm === 'always' && now - lastVoiceTime > 8000) {
lastVoiceTime = now;
speak(t('straight'));
}
}

if(state !== 'ok' && now - lastBeepTime > 700){
lastBeepTime = now;
const pan = diff > 0 ? 1 : -1;
const urgency = Math.min(absDiff / (th * 3), 1);
beep(pan, 420 + urgency * 260, 0.16);
vibrate(absDiff > th*2 ? [80, 60, 80] : [70]);
}
}

function handleGPS(pos){
if(!running) return;
const now = performance.now();
if(now - lastGPSTime < 3000) return;
lastGPSTime = now;
const c = pos.coords;
if(c.accuracy > 20) return;

if(lastLat === null){
lastLat = c.latitude; lastLon = c.longitude;
return;
}

const R=6371; const dLat=(c.latitude-lastLat)*Math.PI/180; const dLon=(c.longitude-lastLon)*Math.PI/180;
const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lastLat*Math.PI/180)*Math.cos(c.latitude*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
const segDist = R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*1000;

if(segDist > 2) {
totalDistMeters += segDist;
lastLat = c.latitude; lastLon = c.longitude;
}
}

function setTarget(){
if(lastHeading !== null){
targetHeading = lastHeading;
announce(t('dirSet'), t('dirSetSub'));
statusBox.className = 'status ok';
} else {
announce(t('waitCompass'), '');
}
}

async function start(){
permMsg.textContent = '';
headingSupported = false;
targetHeading = null;
totalDistMeters = 0; sumDriftMeters = 0; driftSamples = 0; lastLat = null; lastGPSTime = 0;

if(!window.isSecureContext){ permMsg.textContent = t('errNoSecure'); return; }

if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
permMsg.textContent = t('errPerm');
try{
const res = await Promise.race([
DeviceOrientationEvent.requestPermission(),
new Promise((_,rej)=>setTimeout(()=>rej(new Error('T')),4000))
]);
if(res==='granted') permMsg.textContent = t('errGranted');
else { permMsg.textContent = t('errDenied'); return; }
}catch(e){ permMsg.textContent = t('errTimeout'); return; }
}

window.addEventListener('deviceorientation', handleOrientation, true);
if(navigator.geolocation) navigator.geolocation.watchPosition(handleGPS, ()=>{}, {enableHighAccuracy:true});

running = true;
mainBtn.textContent = t('stop');
mainBtn.classList.add('stop');
mainBtn.setAttribute('aria-label', t('stop'));
resetBtn.disabled = false;
announce(t('scanning'), t('scanningSub'));
statusBox.className = 'status off';

watchdog = setTimeout(()=>{ if(!headingSupported) permMsg.textContent = t('errNoData'); }, 3000);
setTimeout(setTarget, 1200);
}

function stop(){
running = false;
window.removeEventListener('deviceorientation', handleOrientation, true);
clearTimeout(watchdog);
if(navigator.vibrate) navigator.vibrate(0);

mainBtn.textContent = t('start');
mainBtn.classList.remove('stop');
mainBtn.setAttribute('aria-label', t('start'));
resetBtn.disabled = true;
targetHeading = null;
statusBox.className = 'status off';

if(totalDistMeters > 5 && driftSamples > 0) {
const avgDrift = sumDriftMeters / driftSamples;
let statText = t('statDist') + ": " + Math.round(totalDistMeters) + " " + t('statMeters') + ". ";
statText += t('statAvg') + ": " + avgDrift.toFixed(1) + " " + t('statMeters') + ".";
speak(statText);
announce(t('stopped'), statText);
} else {
announce(t('stopped'), t('stoppedSub'));
}
}

mainBtn.addEventListener('click', () => { running ? stop() : start(); });
resetBtn.addEventListener('click', setTarget);

if(typeof DeviceOrientationEvent === 'undefined'){
permMsg.textContent = t('errNoSensor');
mainBtn.disabled = true;
}

applyLang();
})();
</script>
</body>
</html>
